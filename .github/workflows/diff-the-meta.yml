name: Track GitHub Meta IP Changes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-meta-ip-diff
  cancel-in-progress: false

jobs:
  diff-meta-ips:
    name: Diff GitHub meta IP list
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_LABEL: github-meta-ip-change
      BASELINE_TITLE: GitHub meta IP baseline
    steps:
      - name: Fetch GitHub meta IP list
        run: |
          set -euo pipefail

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/meta > meta.json

          jq -S '
            {
              verifiable_password_authentication,
              ssh_key_fingerprints,
              ssh_keys,
              hooks,
              web,
              api,
              git,
              packages,
              pages,
              importer,
              actions,
              dependabot,
              copilot,
              domains
            }
            | with_entries(select(.value != null))
          ' meta.json > current-meta-ips.json

          sha256sum current-meta-ips.json | awk '{print $1}' > current-sha.txt

      - name: Find previous baseline issue
        run: |
          set -euo pipefail

          issue_number="$(
            gh issue list \
              --state all \
              --label "$TRACKING_LABEL" \
              --search "in:title \"$BASELINE_TITLE\"" \
              --json number,title \
              --jq '.[] | select(.title == env.BASELINE_TITLE) | .number' \
              | head -n 1
          )"

          echo "issue_number=$issue_number" >> "$GITHUB_ENV"

          if [ -n "$issue_number" ]; then
            gh issue view "$issue_number" --json body --jq '.body' > baseline-body.md
            awk '/<!-- github-meta-baseline:start -->/{flag=1;next}/<!-- github-meta-baseline:end -->/{flag=0}flag' baseline-body.md > previous-meta-ips.json || true
            if ! jq empty previous-meta-ips.json >/dev/null 2>&1; then
              : > previous-meta-ips.json
            fi
          else
            : > previous-meta-ips.json
          fi

          if [ -s previous-meta-ips.json ]; then
            sha256sum previous-meta-ips.json | awk '{print $1}' > previous-sha.txt
          else
            echo '' > previous-sha.txt
          fi

      - name: Diff current meta IP list against baseline
        id: diff
        run: |
          set -euo pipefail

          current_sha="$(cat current-sha.txt)"
          previous_sha="$(cat previous-sha.txt)"

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          if [ -z "$previous_sha" ]; then
            echo "changed=baseline_missing" >> "$GITHUB_OUTPUT"
            echo 'No previous baseline was found.' > diff.md
          elif [ "$current_sha" = "$previous_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No GitHub meta IP list changes detected.' > diff.md
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '```diff'
              diff -u previous-meta-ips.json current-meta-ips.json || true
              echo '```'
            } > diff.md
          fi

      - name: Create baseline issue
        if: steps.diff.outputs.changed == 'baseline_missing'
        run: |
          set -euo pipefail

          current_sha="${{ steps.diff.outputs.current_sha }}"
          body="$(mktemp)"

          cat > "$body" <<EOF
          This issue stores the baseline snapshot used by the GitHub meta IP diff workflow.

          Current baseline SHA-256: \`$current_sha\`

          Last updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          <!-- github-meta-baseline:start -->
          $(cat current-meta-ips.json)
          <!-- github-meta-baseline:end -->
          EOF

          gh issue create \
            --title "$BASELINE_TITLE" \
            --label "$TRACKING_LABEL" \
            --body-file "$body"

      - name: Create tracking issue for detected changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          current_sha="${{ steps.diff.outputs.current_sha }}"
          previous_sha="${{ steps.diff.outputs.previous_sha }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="GitHub meta IP list changed on $(date -u +'%Y-%m-%d')"
          body="$(mktemp)"

          cat > "$body" <<EOF
          The GitHub meta IP list returned by https://api.github.com/meta has changed.

          - Previous baseline SHA-256: \`$previous_sha\`
          - Current SHA-256: \`$current_sha\`
          - Workflow run: $run_url

          ## Diff

          $(cat diff.md)
          EOF

          gh issue create \
            --title "$title" \
            --label "$TRACKING_LABEL" \
            --body-file "$body"

      - name: Update baseline issue after detected changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          current_sha="${{ steps.diff.outputs.current_sha }}"
          body="$(mktemp)"

          cat > "$body" <<EOF
          This issue stores the baseline snapshot used by the GitHub meta IP diff workflow.

          Current baseline SHA-256: \`$current_sha\`

          Last updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          <!-- github-meta-baseline:start -->
          $(cat current-meta-ips.json)
          <!-- github-meta-baseline:end -->
          EOF

          gh issue edit "$issue_number" --body-file "$body"
